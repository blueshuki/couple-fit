<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2d4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="減脂 \Fight/">
<title>減脂 \Fight/</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#faf7f0; --card:#fff; --ink:#1f2433; --muted:#8a8577; --line:#ebe5d8; --soft:#f4efe4;
  --navy:#1f2d4d; --navy2:#2e4170; --gold:#ffcc2e; --gold2:#e0a800; --goldsoft:#fff5cf; --red:#d2463c;
  --ok:#3f8a5a; --warn:#d2603f;
  --p:#d2603f; --c:#e8b23a; --f:#5b86b5; --fib:#6b9c5e; --na:#8c7bb5; --water:#4fa3c7;
  --A:#1f2d4d; --B:#e0a800;
  --r:16px; --safeb:env(safe-area-inset-bottom,0px); --safet:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:540px;margin:0 auto;padding:0 14px calc(86px + var(--safeb))}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:var(--safet)}
header.top .in{max-width:540px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
header.top h1 .amp{color:var(--gold)}
header.top .stitch{height:6px;background:var(--gold);position:relative}
header.top .stitch:after{content:"";position:absolute;left:0;right:0;top:2px;height:2px;background:repeating-linear-gradient(90deg,var(--red) 0 5px,transparent 5px 11px);opacity:.7}
.bell{position:relative;background:rgba(255,255,255,.08);border:0;color:#fff;width:34px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.bell .ic{width:19px;height:19px}
.bell .badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center;padding:0 4px;box-shadow:0 0 0 2px var(--navy)}
.nt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.nt:first-of-type{border-top:0}
.nt .ni{width:32px;height:32px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--navy)}
.nt.todo .ni{background:#fff4d6;color:#a06a00}
.nt.info .ni{background:#fbeef0;color:#9a4458}
.nt .nb{flex:1;min-width:0}
.nt .nb b{font-size:14px;display:block}
.nt .nb div{font-size:12.5px;color:var(--muted)}
.nt .new{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;margin-top:6px}
.ng{font-size:12px;color:var(--muted);font-weight:700;margin:12px 0 2px}
.sync{font-size:12px;color:#dfe5f2;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:0;padding:4px 9px;border-radius:99px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa3b5;display:inline-block}
.dot.ok{background:#6fd08f}.dot.pend{background:var(--gold)}.dot.err{background:#ff7a6e}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--safeb)}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 0 9px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
nav.tabs .ic{width:22px;height:22px}
nav.tabs button.on{color:var(--navy);font-weight:700}
nav.tabs button.on:before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.ic{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px;flex:none}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:12px 0;border:1px solid #efe8da;position:relative}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sub{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
.card h2:before{content:"";width:4px;height:15px;border-radius:2px;background:var(--gold);display:inline-block}
.card.flat h2:before{display:none}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:8px}.rwrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;background:var(--soft);font-size:11.5px;color:var(--muted);white-space:nowrap}
.chip.gold{background:var(--goldsoft);color:#8a6a00}
.chip.navy{background:#e7ebf4;color:var(--navy)}
input[type=text],input[type=number],input[type=url],input[type=password],input[type=search],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:16px}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--navy);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* couple field */
.field{margin-top:12px;border-radius:20px;background:linear-gradient(180deg,#fff 0%,#fff 55%,#f3ecd9 100%);border:1px solid #efe8da;padding:10px 8px 8px;position:relative;overflow:hidden}
.field:before{content:"";position:absolute;left:50%;bottom:-150px;width:340px;height:220px;transform:translateX(-50%);border-radius:50%;border:2px dashed #e6dcc3;opacity:.8}
.couple{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative}
.pcard{text-align:center;cursor:pointer;position:relative;padding:4px 4px 6px;border-radius:16px;border:2px solid transparent}
.pcard.sel{border-color:var(--A);background:rgba(31,45,77,.03)}
.pcard.b.sel{border-color:var(--B);background:rgba(224,168,0,.05)}
.pcard .nm{font-weight:800;font-size:15px}
.pcard svg.av{width:100%;max-width:140px;height:auto;display:block;margin:0 auto}
.pcard svg.av2{width:auto;max-width:100%;height:230px}
.avprev svg.av2{width:auto;height:280px}
.pcard .stat{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:2px}
.pcard .stat .t{font-size:12px;line-height:1.35;text-align:left}
.me-tag{position:absolute;top:6px;left:8px;font-size:10px;background:var(--navy);color:#fff;padding:1px 7px;border-radius:9px}
.b .me-tag{background:var(--gold2)}
.field .cat{position:absolute;bottom:4px}
.field .cat.l{left:4px}.field .cat.r{right:4px}
/* today */
.today{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.mac{margin:5px 0}
.mac .lab{display:flex;justify-content:space-between;font-size:13px;gap:6px}
.mac .lab b{font-weight:700}
.mac .bar{height:7px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:3px}
.mac .bar i{display:block;height:100%;border-radius:9px}
.gap{font-size:12px;color:var(--muted);white-space:nowrap}
.gap.over{color:var(--warn)}.gap.ok{color:var(--ok)}
.advice p{margin:0;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.advice p:first-child{border-top:0;padding-top:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv>div{background:var(--soft);border-radius:12px;padding:8px 10px}
.kv b{display:block;font-size:17px}
.kv span{font-size:11px;color:var(--muted)}
.big{font-size:26px;font-weight:800;letter-spacing:.5px;color:var(--navy)}
.explain .head{font-size:14.5px}
.explain ol{margin:8px 0 0;padding-left:20px}
.explain li{margin:4px 0;font-size:14px}
.qbox{background:var(--goldsoft);border-radius:12px;padding:10px;margin-top:10px}
.cheer{display:flex;gap:10px;align-items:flex-start;background:var(--goldsoft);border:1px solid #f4e3a3;border-radius:14px;padding:10px 12px;margin-top:12px}
.cheer .ic{color:var(--gold2)}
.water{display:flex;align-items:center;gap:8px}
.water .bar{flex:1;height:8px;background:var(--soft);border-radius:9px;overflow:hidden}
.water .bar i{display:block;height:100%;background:var(--water)}
/* lists */
.meal-h{display:flex;align-items:center;gap:8px;padding:8px 0 4px;border-bottom:1px solid var(--line)}
.meal-h b{font-size:14px}
.ent{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft);cursor:pointer}
.ent .nm{font-size:14px}
.ent .mc{font-size:11px;color:var(--muted)}
.ent .kc{font-weight:700;font-size:14px;white-space:nowrap}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.datebar b{font-size:15px}
.actions5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.actions5 .btn{flex-direction:column;padding:10px 2px;font-size:11.5px;gap:3px}
.actions5 .ic{color:var(--navy);width:22px;height:22px}
/* workout */
.ex{border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}
.ex-h{display:flex;align-items:center;gap:8px}
.ex-h b{flex:1}
.last{font-size:12px;color:var(--muted);margin:2px 0 6px}
.hint{font-size:12px;color:var(--navy);background:var(--goldsoft);border-radius:8px;padding:4px 8px;margin:2px 0 6px}
table.sets{width:100%;border-collapse:collapse}
table.sets th{font-size:11px;color:var(--muted);font-weight:500;text-align:center;padding:2px}
table.sets td{padding:3px 2px;text-align:center}
table.sets td input{text-align:center;padding:6px 4px}
table.sets td.n{width:26px;color:var(--muted);font-size:13px}
table.sets tr.done td input{background:#eef1f8;border-color:#cdd5e6}
.ck{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ck.on{background:var(--navy);border-color:var(--navy);color:var(--gold)}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--safeb));z-index:40;background:var(--navy);color:#fff;border-radius:99px;padding:8px 16px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);border:2px solid var(--gold)}
.rest button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
details.plan summary{cursor:pointer;font-weight:700;list-style:none}
details.plan summary::-webkit-details-marker{display:none}
.tpl{background:var(--soft);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:13px}
.tpl b{display:block;margin-bottom:2px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(20,24,36,.4)}
.sheet-body{position:relative;background:#fff;width:100%;max-width:540px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + var(--safeb));animation:up .18s ease-out;border-top:4px solid var(--gold)}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet-body h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.sheet-body h3 .x{margin-left:auto}
.ai-item{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0}
.ai-item.off{opacity:.45}
.ai-item .g{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
.ai-item .g input{padding:5px 2px;text-align:center;font-size:15px}
.ai-item .g span{font-size:10px;color:var(--muted);text-align:center;display:block}
.lib-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--soft);cursor:pointer}
.photo-prev{width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin:8px 0;display:block}
.toast{position:fixed;top:calc(70px + var(--safet));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;z-index:60;max-width:90%;text-align:center;border:1px solid var(--gold)}
.swatches{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--navy)}
.avprev{display:flex;justify-content:center;background:var(--soft);border-radius:14px;padding:8px}
.avprev svg{width:130px;height:auto}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.chart svg{width:100%;height:auto;display:block}
.hr{height:1px;background:var(--line);margin:12px 0}
.note{background:#fbf7ef;border:1px solid #f0e6d2;border-radius:12px;padding:8px 10px;font-size:13px;color:#6d5a3a}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12.5px;padding:14px 0}
.cmp{position:relative;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--soft)}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .top{clip-path:inset(0 50% 0 0)}
.cmp .lbl{position:absolute;top:8px;background:rgba(31,45,77,.8);color:#fff;font-size:11px;padding:2px 8px;border-radius:8px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;font-size:12px;cursor:pointer}
.thumbs button.on{border-color:var(--navy);background:#e7ebf4}
.phase{display:inline-flex;align-items:center;gap:6px;background:#fbeef0;color:#9a4458;border-radius:99px;padding:2px 10px;font-size:12px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--soft);border-radius:8px;padding:8px;word-break:break-all;user-select:all}
.paws{display:flex;justify-content:center;gap:10px;opacity:.6;margin:14px 0 4px}
ol.steps{padding-left:20px;margin:6px 0}ol.steps li{margin:5px 0;font-size:13.5px}
</style>
</head>
<body>
<header class="top"><div class="in"><h1 id="title">減脂 \Fight/</h1><button class="bell" data-act="notif" aria-label="通知" id="bellBtn"></button><button class="sync" data-act="syncNow"><span class="dot" id="syncDot"></span><span id="syncTxt">本機</span></button></div><div class="stitch"></div></header>
<main class="wrap" id="main"></main>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="sheet hidden" id="sheet"><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-body" id="sheetBody"></div></div>
<div id="restBox"></div>
<script src="js/data.js?v=2.4.1"></script>
<script src="js/art.js?v=2.4.1"></script>
<script src="js/chars.js?v=2.4.1"></script>
<script src="js/views.js?v=2.4.1"></script>
<script src="js/app.js?v=2.4.1"></script>
</body>
</html>
